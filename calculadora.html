<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="/HTML/CSS/calculadora.css">
    <script src="/HTML/JS/calculadora.js" defer></script>
</head>
<body>
    <header>
        <section class="opciones">
            <p><a class="OP" href="/index.html" class="opcion">Inicio</a></p>
            <p><a class="OP" href="/Formulario.html" class="opcion">Formulario de Pedido</a></p>
            <p><a class="OP" href="/PRODUCTOS VIDEOJUEGOS.html" class="opcion">Catalogo de Videojuegos</a></p>
            <p><a class="OP" href="/calculadora.html" class="opcion">Calculadora</a></p>
            <p><a class="OP" href="/Descuentos.html" class="opcion">Gestion de Descuentos</a></p>
            <p><a class="OP" href="/PPT.html" class="opcion">Piedra, Papel o Tijera</a></p>
            <p><a class="OP" href="/AdivinaNumero.html" class="opcion">Adivina el Número</a></p>
            <p><a class="OP" href="/tabla.html" class="opcion">Tabla Multiplicar</a></p>
        </section>
    </header>
    <main class="contenido-principal">
        <section class="calculadora">
            <div class="pantalla" id="pantalla">
            </div>
            <div class="botones">
                <button class="btn btn-limpiar" id="btnLimpiar" >C</button>
                <button class="btn btn-borrar" id="btnBorrar">&#9003;</button>
                <button class="btn btn-operador btn-tecla">/</button>
                <button class="btn btn-operador btn-tecla">*</button>
                <button class="btn btn-tecla">7</button>
                <button class="btn btn-tecla">8</button>
                <button class="btn btn-tecla">9</button>
                <button class="btn btn-operador btn-tecla">-</button>
                <button class="btn btn-tecla">4</button>
                <button class="btn btn-tecla">5</button>
                <button class="btn btn-tecla">6</button>
                <button class="btn btn-operador btn-tecla">+</button>
                <button class="btn btn-tecla">1</button>
                <button class="btn btn-tecla">2</button>
                <button class="btn btn-tecla">3</button>
                <button class="btn btn-igual" id="btnIgual">=</button>
                <button class="btn btn-tecla btn-cero">0</button>
                <button class="btn btn-tecla">.</button> 
            </div>
        </section>
    </main>
